_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '_base_/picodet_v2.yml',
  '_base_/optimizer_300e.yml',
  '_base_/picodet_640_reader.yml',
]

weights: output/picodet_m_640_coco/best_model
find_unused_parameters: True
use_ema: true
epoch: 300
snapshot_epoch: 10

TrainReader:
  batch_size: 24

LearningRate:
  base_lr: 0.12
  schedulers:
  - !CosineDecay
    max_epochs: 300
    min_lr_ratio: 0.001
    last_plateau_epochs: 15
  - !ExpWarmup
    epochs: 2
