_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  './_base_/optimizer_80e.yml',
  './_base_/ppyoloe_plus_crn.yml',
  './_base_/ppyoloe_plus_reader.yml',
]

log_iter: 100
snapshot_epoch: 1
weights: output/yoloe2e_detr/model_final
find_unused_parameters: True

pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_l_obj365_pretrained.pdparams
depth_mult: 1.0
width_mult: 1.0


TrainReader:
  batch_size: 8

EvalReader:
  batch_size: 8


YOLOv3:
  backbone: CSPResNet
  neck: CustomCSPPAN
  yolo_head: PHead
  post_process: DETRBBoxPostProcess


CSPResNet:
  layers: [3, 6, 6, 3]
  channels: [64, 128, 256, 512, 1024]
  return_idx: [1, 2, 3]
  use_large_stem: True
  use_alpha: True

CustomCSPPAN:
  out_channels: [768, 384, 192]
  stage_num: 1
  block_num: 3
  act: 'swish'
  spp: true

PHead:
  in_channels_list: [768, 384, 192]
  strides_list: [32, 16, 8]
  hidden_dim: 256
  num_classes: 80
  use_head_stem: True
  act: 'silu'
  data_fmt: 'row_first'
  num_proposals_list: [50, 100, 50]


DETRLoss:
  loss_coeff: {class: 1, bbox: 5, giou: 2, no_object: 0.1, mask: 1, dice: 1}
  aux_loss: True


HungarianMatcher:
  matcher_coeff: {class: 1, bbox: 5, giou: 2}
