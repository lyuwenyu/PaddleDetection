_BASE_: [
  '../runtime.yml',
  '../picodet/picodet_m_320_coco_lcnet.yml',
  './lst_dataset_obj365.yml',
]


log_iter: 100
snapshot_epoch: 10
weights: output/lst_picodet_m_320_60e/model_final


PicoHeadV2:
  static_assigner_epoch: 20


epoch: 60

TrainReader:
  batch_size: 48

LearningRate:
  base_lr: 0.24
  schedulers:
  - !CosineDecay
    max_epochs: 60
  - !LinearWarmup
    start_factor: 0.1
    epochs: 1 # 60
