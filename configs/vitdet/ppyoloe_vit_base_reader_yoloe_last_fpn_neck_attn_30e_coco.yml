

_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
]

snapshot_epoch: 1
log_iter: 100

# optimizer
epoch: &epoch 30

LearningRate:
  base_lr: 0.0001
  schedulers:
    - !CosineDecay
      max_epochs: *epoch
      min_lr_ratio: 0.01
      # last_plateau_epochs: 10
    - !LinearWarmup
      start_factor: 0.
      epochs: 1


