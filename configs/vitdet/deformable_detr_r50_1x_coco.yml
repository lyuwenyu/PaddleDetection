#   query_selection: True
#   # query_selection_level_numbers: [100, 100, 100]
#   use_project_featurs: False



DeformableDETRHead:
  num_mlp_layers: 3


DETRLoss:
  loss_coeff: {class: 2, bbox: 5, giou: 2, mask: 1, dice: 1}
  aux_loss: True


HungarianMatcher:
  matcher_coeff: {class: 2, bbox: 5, giou: 2}
