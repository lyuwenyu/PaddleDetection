# SWIN OPTIMIZER
OptimizerBuilder:
  clip_grad_by_norm: 1.0
  optimizer:
    type: AdamW
    weight_decay: 0.05
    param_groups:
        -
          params: ['norm', 'cls_token', 'pos_embed', '.bias', 'bn.weight']
          weight_decay: 0.


