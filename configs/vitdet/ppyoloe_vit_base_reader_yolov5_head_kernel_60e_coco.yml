

_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
]

snapshot_epoch: 1


# optimizer
epoch: &epoch 60

LearningRate:
  base_lr: 0.0001
  schedulers:
    - !CosineDecay
      max_epochs: *epoch
    - !LinearWarmup
      start_factor: 0.
      epochs: 1

