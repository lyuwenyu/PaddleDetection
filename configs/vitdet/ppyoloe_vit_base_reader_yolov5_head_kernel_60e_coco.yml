# SWIN OPTIMIZER
OptimizerBuilder:
  clip_grad_by_norm: 1.0
  optimizer:
    type: AdamW
    weight_decay: 0.05
    param_groups:
        -
          params: ['norm', 'cls_token', 'pos_embed', '.bias', 'bn.weight']
          weight_decay: 0.



# model
# model
architecture: YOLOv3
norm_type: sync_bn
use_ema: true
ema_decay: 0.9999
ema_warmup_steps: 2000
ema_skip_names: ['yolo_head.proj_conv', 'backbone.pos_embed']


# custom_black_list: ['reduce_mean']
find_unused_parameters: True
use_fused_allreduce_gradients: &use_checkpoint False


YOLOv3:
  backbone: VisionTransformer
  neck: YOLOCSPPAN
  yolo_head: PPYOLOEHead
  post_process: ~


VisionTransformer:
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  qkv_bias: True
  drop_rate: 0.0
  drop_path_rate: 0.2
  init_values: 0.1
  final_norm: False
  use_rel_pos_bias: False
  use_sincos_pos_emb: True
  epsilon: 0.000001 # 1e-6
  out_indices: [5, 7, 11]
  with_fpn: True
  use_checkpoint: *use_checkpoint
  pretrained: https://bj.bcebos.com/v1/paddledet/models/pretrained/vit_base_cae_pretrained.pdparams



YOLOCSPPAN:
  depthwise: False
  in_channels: [768, 768, 768]
  act: 'silu'


PPYOLOEHead:
  # reverse: True
  fpn_strides: [8, 16, 32]
  in_channels: [768, 768, 768]

  preds_kernel: 1

  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 20
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.01
    nms_threshold: 0.7


# YOLOv5 READER
input_height: &input_height 640
input_width: &input_width 640
input_size: &input_size [*input_height, *input_width]
eval_size: &eval_size [*input_height, *input_width]
mosaic_epoch: &mosaic_epoch 60

worker_num: 4
TrainReader:
  sample_transforms:
    - Decode: {}
    # - MosaicPerspective: {target_size: *input_size, mosaic_prob: 1.0, mixup_prob: 0.15, paste_in_prob: 0.15, translate: 0.2, scale: 0.9}
    - MosaicPerspective: {target_size: *input_size, mosaic_prob: 1.0}
    - RandomHSV: {hgain: 0.015, sgain: 0.7, vgain: 0.4}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576, 608, 640, 672, 704, 736, 768], random_size: True, random_interp: True, keep_ratio: True}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}
  batch_size: 2
  shuffle: True
  drop_last: False
  use_shared_memory: False
  collate_batch: True
  mosaic_epoch: *mosaic_epoch

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *input_size, keep_ratio: True, interp: 1}
    # - Resize: {target_size: [1280, 1280] , keep_ratio: True, interp: 1}
    - Pad: {size: *input_size, fill_value: [114., 114., 114.]}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 8

TestReader:
  inputs_def:
    image_shape: [3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *input_size, keep_ratio: True, interp: 1}
    - Pad: {size: *input_size, fill_value: [114., 114., 114.]}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1
  fuse_normalize: True
