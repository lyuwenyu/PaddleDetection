_BASE_: [
  '../datasets/coco_instance.yml',
  '../runtime.yml',
  # '_base_/optimizer_1x.yml',
  # '_base_/mask_rcnn_r50_fpn.yml',
  '../mask_rcnn/_base_/mask_fpn_reader.yml',
]
weights: output/mask_rcnn_vit_base_16_fpn_coco/model_final


snapshot_epoch: 1


# 1x optimizer
epoch: 12
base_lr: 0.0001 # 0.0003
# milestones: [8, 11]
milestones: [9, 11]
# warmup_iters: 2000 # 2 x 8 500
warmup_iters: 500 # 2 x 8 500
warmup_ratio: 0.001


weight_decay: 0.05 # 0.0
# weight_decay: 0.02 # 0.0
layer_decay: 0.75


worker_num: 2
TrainReader:
  batch_size: 1


use_gpu: false
norm_type: sync_bn

find_unused_parameters: True




architecture: MaskRCNN


MaskRCNN:
  backbone: VisionTransformer
  neck: FPN
  rpn_head: RPNHead
  bbox_head: BBoxHead
  mask_head: MaskHead
  # post process
  bbox_post_process: BBoxPostProcess
  mask_post_process: MaskPostProcess


VisionTransformer:
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  qkv_bias: True
  drop_rate: 0.0
  drop_path_rate: 0.2 #
  init_values: 0.1
  use_rel_pos_bias: False #
  epsilon: 0.000001 # 1e-6
  out_indices: [3, 5, 7, 11]
  # pretrained: ../params/pretrain_mae_vit_base_mask_0.75_400e.params


FPN:
  out_channel: 256

RPNHead:
  anchor_generator:
    aspect_ratios: [0.5, 1.0, 2.0]
    anchor_sizes: [[32], [64], [128], [256], [512]]
    strides: [4, 8, 16, 32, 64]
  rpn_target_assign:
    batch_size_per_im: 256
    fg_fraction: 0.5
    negative_overlap: 0.3
    positive_overlap: 0.7
    use_random: True
  train_proposal:
    min_size: 0.0
    nms_thresh: 0.7
    pre_nms_top_n: 2000
    post_nms_top_n: 1000
    topk_after_collect: True
  test_proposal:
    min_size: 0.0
    nms_thresh: 0.7
    pre_nms_top_n: 1000
    post_nms_top_n: 1000

BBoxHead:
  head: TwoFCHead
  roi_extractor:
    resolution: 7
    sampling_ratio: 0
    aligned: True
  bbox_assigner: BBoxAssigner

BBoxAssigner:
  batch_size_per_im: 512
  bg_thresh: 0.5
  fg_thresh: 0.5
  fg_fraction: 0.25
  use_random: True

TwoFCHead:
  out_channel: 1024

BBoxPostProcess:
  decode: RCNNBox
  nms:
    name: MultiClassNMS
    keep_top_k: 100
    score_threshold: 0.05
    nms_threshold: 0.5

MaskHead:
  head: MaskFeat
  roi_extractor:
    resolution: 14
    sampling_ratio: 0
    aligned: True
  mask_assigner: MaskAssigner
  share_bbox_feat: False

MaskFeat:
  num_convs: 4
  out_channel: 256

MaskAssigner:
  mask_resolution: 28

MaskPostProcess:
  binary_thresh: 0.5
