
_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  './_base_/ppyoloe_reader.yml',
  # './_base_/optimizer_base_30e.yml'
]

weights: output/ppyoloe_vit_base_csppan_cae_30e_coco/model_final


snapshot_epoch: 2
log_iter: 100


use_ema: true
ema_decay: 0.9999 # 0.9997
ema_skip_names: ['yolo_head.proj_conv.weight', 'backbone.pos_embed']
custom_black_list: ['reduce_mean']
use_fused_allreduce_gradients: &use_checkpoint True


architecture: YOLOv3
norm_type: sync_bn

YOLOv3:
  backbone: VisionTransformer
  neck: ~
  yolo_head: PPYOLOEHead
  post_process: ~

VisionTransformer:
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  qkv_bias: True
  drop_rate: 0.0
  drop_path_rate: 0.2
  init_values: 0.1
  final_norm: False
  use_rel_pos_bias: False
  use_sincos_pos_emb: True
  epsilon: 0.000001 # 1e-6
  out_indices: [5, 7, 11]

  with_fpn: False
  num_fpn_levels: 3
  out_with_norm: False
  use_dcn: True
  use_checkpoint: *use_checkpoint
  pretrained: https://bj.bcebos.com/v1/paddledet/models/pretrained/vit_base_cae_pretrained.pdparams


# YOLOCSPPAN:
#   in_channels: [768, 768, 768]
#   interpolate_mode: 'bilinear' # nearest bicubic
#   use_dcn: False


PPYOLOEHead:
  fpn_strides: [8, 16, 32]
  in_channels: [768, 768, 768]
  static_assigner_epoch: -1

  use_msdcn_head: True
  aux_loss: False
  num_layers: 6
  num_stages: 4
  offset_kernel: 3

  reg_max: 24 # 16

  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.01
    nms_threshold: 0.7


epoch: 36
LearningRate:
  base_lr: 0.0001
  schedulers:
    - !CosineDecay
      max_epochs: 36
      min_lr_ratio: 0.01
      # last_plateau_epochs: 10
    - !LinearWarmup
      start_factor: 0.
      epochs: 1




worker_num: 4
eval_height: &eval_height 960
eval_width: &eval_width 960
eval_size: &eval_size [*eval_height, *eval_width]


TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomDistort: {p: 0.9}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {p: 0.9}
    - RandomFlip: {}
  batch_transforms:
    # - BatchRandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576, 608, 640, 672, 704, 736, 768], random_size: True, random_interp: True, keep_ratio: False}
    - BatchRandomResize: {target_size: [800, 832, 864, 896, 928, 960, 960, 960, 960, 992, 1024, 1056, 1088, 1120], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}
  batch_size: 2
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true


EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 2
