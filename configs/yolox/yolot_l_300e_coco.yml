_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  './_base_/optimizer_300e.yml',
  # './_base_/yolox_cspdarknet.yml',
  './_base_/yolox_reader.yml'
]

log_iter: 100
snapshot_epoch: 10
weights: output/yolox_l_300e_coco/model_final


architecture: YOLOX
norm_type: sync_bn
use_ema: True
ema_decay: 0.9999
ema_decay_type: "exponential"
act: silu
find_unused_parameters: True
use_gpu: false


depth_mult: 1.0
width_mult: 1.0


YOLOX:
  backbone: CSPDarkNet
  neck: TEncoder
  head: YOLOXHead
  size_stride: 32
  size_range: [15, 25] # multi-scale range [480*480 ~ 800*800]

CSPDarkNet:
  arch: "X"
  return_idx: [3, ] # [2, 3, 4]
  depthwise: False

TEncoder:
  hidden_dim: 256
  num_layers: 6

YOLOXHead:
  l1_epoch: 285
  depthwise: False
  loss_weight: {cls: 1.0, obj: 1.0, iou: 5.0, l1: 1.0}
  assigner:
    name: SimOTAAssigner
    candidate_topk: 10
    use_vfl: False
  nms:
    name: MultiClassNMS
    nms_top_k: 10000
    keep_top_k: 1000
    score_threshold: 0.001
    nms_threshold: 0.65
