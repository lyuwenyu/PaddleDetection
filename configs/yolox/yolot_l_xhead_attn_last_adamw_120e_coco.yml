_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  # './_base_/optimizer_300e.yml',
  # './_base_/yolox_cspdarknet.yml',
  './_base_/yolox_reader.yml',
  './_base_/optimizer_adamw_120.yml'
]

log_iter: 100
snapshot_epoch: 5
weights: output/yolot_l_xhead_attn_last_120e_coco/model_final

architecture: YOLOX
norm_type: sync_bn
use_ema: True
ema_decay: 0.9999
ema_decay_type: "exponential"
# act: relu # silu
find_unused_parameters: True
use_gpu: True
use_fused_allreduce_gradients: &use_checkpoint True


depth_mult: 1.0
width_mult: 1.0


YOLOX:
  backbone: CSPDarkNet
  neck: TEncoder
  head: XHead
  size_stride: 32
  size_range: [15, 25] # multi-scale range [480*480 ~ 800*800]

CSPDarkNet:
  arch: "X"
  return_idx: [2, 3, 4] # [2, 3, 4]
  depthwise: False

TEncoder:
  hidden_dim: 256
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.

  skip_connection: True
  fused_multi_stages: True
  return_intermediate: True
  output_method: 'attention' # fpn
  global_stage: 2
  output_with_pos_embedding: False
  use_checkpoint: *use_checkpoint
  auxiliary_epoch: 1


XHead:
  l1_epoch: 110
  depthwise: False
  loss_weight: {cls: 1.0, obj: 1.0, iou: 5.0, l1: 1.0}

  with_stem_conv: True
  num_decoder_conv: 2
  stage_weights: [1., 1., 1., 1., 1., 1.]
  predict_level_id: -1

  assigner:
    name: SimOTAAssigner
    candidate_topk: 10
    use_vfl: False
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.001
    nms_threshold: 0.65
    # nms_top_k: 1000
    # keep_top_k: 300
    # nms_threshold: 0.7


worker_num: 4
TrainReader:
  batch_size: 4
  mosaic_epoch: 110


