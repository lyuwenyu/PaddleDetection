epoch: &epoch 120
LearningRate:
  base_lr: 0.0005
  schedulers:
  - !CosineDecay
    max_epochs: *epoch
    min_lr_ratio: 0.05
    last_plateau_epochs: 10
  - !ExpWarmup
    epochs: 5

OptimizerBuilder:
  # clip_grad_by_norm: 1.0
  optimizer:
    type: AdamW
    weight_decay: 0.05
    param_groups:
        -
          params: ['embed', 'bias', 'norm', 'bn']
          weight_decay: 0.


