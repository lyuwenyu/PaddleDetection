_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  # '_base_/optimizer_1x.yml',
  # '_base_/detr_r50.yml',
  '_base_/detr_reader.yml',
]
weights: output/detr_vit_base_1x_coco/model_final
find_unused_parameters: True

epoch: 12

LearningRate:
  base_lr: 0.0001
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [9, 11]
  - !LinearWarmup
    start_factor: 0.001
    steps: 1000

OptimizerBuilder:
  optimizer:
    type: AdamWDL
    betas: [0.9, 0.999]
    layer_decay: 0.75
    weight_decay: 0.02
    num_layers: 12
    filter_bias_and_bn: True
    skip_decay_names: ['pos_embed', 'cls_token']
    set_param_lr_func: 'layerwise_lr_decay'



architecture: DETR
# pretrain_weights: https://paddledet.bj.bcebos.com/models/pretrained/ResNet50_vb_normal_pretrained.pdparams

hidden_dim: 256


DETR:
  backbone: VisionTransformer
  transformer: DETRTransformer
  detr_head: DETRHead
  post_process: DETRBBoxPostProcess


VisionTransformer:
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4
  qkv_bias: True
  drop_rate: 0.0
  drop_path_rate: 0.2
  init_values: 0.1
  final_norm: False
  use_rel_pos_bias: False
  use_sincos_pos_emb: True
  epsilon: 0.000001 # 1e-6
  out_indices: [11, ]
  # out_indices: [3, 5, 7, 11]
  with_fpn: False
  pretrained: https://bj.bcebos.com/v1/paddledet/models/pretrained/vit_base_cae_pretrained.pdparams


DETRTransformer:
  num_queries: 100
  position_embed_type: sine
  nhead: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  dim_feedforward: 1024 # 2048
  dropout: 0.1
  activation: gelu
  without_encoder: True

DETRHead:
  num_mlp_layers: 3


DETRLoss:
  loss_coeff: {class: 1, bbox: 5, giou: 2, no_object: 0.1, mask: 1, dice: 1}
  aux_loss: True


HungarianMatcher:
  matcher_coeff: {class: 1, bbox: 5, giou: 2}
