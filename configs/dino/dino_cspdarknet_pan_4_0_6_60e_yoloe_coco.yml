_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '_base_/optimizer_60e.yml',
  '_base_/dino_r50.yml',
  '_base_/yoloe_reader.yml',
  # '_base_/dino_640_reader.yml',
  # '_base_/optimizer_1x.yml',
]

# pretrain_weights: https://paddledet.bj.bcebos.com/models/yolox_l_300e_coco.pdparams
pretrain_weights: ~

weights: output/dino_cspdarknet_pan_4_0_6_60e_yoloe_coco/model_final
find_unused_parameters: True
log_iter: 100


norm_type: sync_bn
use_ema: True
ema_decay: 0.9999
ema_decay_type: "exponential"



TrainReader:
  batch_size: 4

DETR:
  backbone: CSPDarkNet
  neck: YOLOCSPPAN
  transformer: DINOTransformer
  detr_head: DINOHead
  post_process: DETRBBoxPostProcess



depth_mult: 1.0
width_mult: 1.0


CSPDarkNet:
  arch: "X"
  return_idx: [2, 3, 4]
  depthwise: False


YOLOCSPPAN:
  depthwise: False



DINOTransformer:
  num_queries: 300
  # backbone_feat_channels: [256, 512, 1024]

  position_embed_type: sine
  num_levels: 4
  nhead: 8
  num_encoder_layers: 0
  num_decoder_layers: 6
  dim_feedforward: 2048
  dropout: 0.0
  activation: relu # relu
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learnt_init_query: True
