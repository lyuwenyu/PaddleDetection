epoch: 36

LearningRate:
  base_lr: 0.0001
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    # milestones: [33]
    milestones: [100]
    use_warmup: false

  # - !LinearWarmup
  #   start_factor: 0.001
  #   steps: 2000

OptimizerBuilder:
  clip_grad_by_norm: 0.1
  regularizer: false
  optimizer:
    type: AdamW
    weight_decay: 0.0001
