
worker_num: 2
TrainReader:
  sample_transforms:
  - Decode: {}
  - RandomFlip: {prob: 0.5}

  - RandomSelects: {  transforms1: [
                        RandomShortSideResize: { short_side_sizes: [ 480, 512, 544, 576, 608, 640 ], max_size: 640 }
                      ],
                      transforms2: [
                        RandomShortSideResize: { short_side_sizes: [ 400, 500, 600 ] },
                        RandomSizeCrop: { min_size: 384, max_size: 600 },
                        RandomShortSideResize: { short_side_sizes: [ 480, 512, 544, 576, 608, 640 ], max_size: 640 }
                      ],
                      transforms3: [
                        RandomDistort: {p: 0.8},
                        RandomExpand: {fill_value: [123.675, 116.28, 103.53], prob: 0.5},
                        RandomCrop: {p: 0.8},
                        # RandomResize: {target_size: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800], random_size: True, random_interp: True, keep_ratio: True}, # 49.4
                        # RandomResize: {target_size: [480, 512, 544, 576, 608, 640], random_size: True, random_interp: True, keep_ratio: True}, # 49.7
                        RandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576, 608, 640], random_size: True, random_interp: True, keep_ratio: True},
                        # RandomResize: {target_size: [320, 336, 352, 368, 384, 400, 416, 432, 448, 464, 480, 496, 512, 528, 544, 560, 576, 592, 608, 624, 640], random_size: True, random_interp: True, keep_ratio: True},
                      ],
  }

  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229, 0.224,0.225]}
  - NormalizeBox: {}
  - BboxXYXY2XYWH: {}
  - Permute: {}
  batch_transforms:
  # - PadMaskBatch: {pad_to_stride: -1, return_pad_mask: true}
  - PadMaskBatch: {pad_to_stride: 32, return_pad_mask: true}
  batch_size: 4
  shuffle: true
  drop_last: true
  collate_batch: false
  use_shared_memory: false


EvalReader:
  sample_transforms:
  - Decode: {}
  - Resize: {target_size: [640, 640], keep_ratio: True}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229, 0.224,0.225]}
  - Permute: {}
  batch_transforms:
  # - PadMaskBatch: {pad_to_stride: -1, return_pad_mask: true}
  - PadMaskBatch: {pad_to_stride: 32, return_pad_mask: true}
  batch_size: 1
  shuffle: false
  drop_last: false



TestReader:
  sample_transforms:
  - Decode: {}
  - Resize: {target_size: [640, 640], keep_ratio: True}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229, 0.224,0.225]}
  - Permute: {}
  batch_transforms:
  - PadMaskBatch: {pad_to_stride: -1, return_pad_mask: true}
  batch_size: 1
  shuffle: false
  drop_last: false
