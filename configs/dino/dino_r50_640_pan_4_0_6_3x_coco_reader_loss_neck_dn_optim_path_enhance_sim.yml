_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '_base_/dino_r50.yml',

  '_base_/optimizer_15x.yml',
  # '_base_/enhance_optimizer_3x.yml',
  '_base_/yoloe_reader.yml',
  # '_base_/enhance_yoloe_reader.yml',
]

metric: COCO
num_classes: 80

TrainDataset:
  !COCODataSet
    image_dir: train2017
    anno_path: annotations/instances_train2017.json
    dataset_dir: dataset/coco
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
    keep_categary_id: False

EvalDataset:
  !COCODataSet
    image_dir: val2017
    anno_path: annotations/instances_val2017.json
    dataset_dir: dataset/coco
    allow_empty: true
    keep_categary_id: False




weights: output/dino_r50_640_pan_4_0_6_3x_coco_reader_loss_neck_dn_optim_path_enhance/model_final
find_unused_parameters: True
log_iter: 100


pretrain_weights: https://paddledet.bj.bcebos.com/models/pretrained/ResNet50_vd_ssld_v2_pretrained.pdparams
norm_type: sync_bn
use_ema: True
ema_decay: 0.9999
ema_decay_type: "exponential"
ema_filter_no_grads: True
ema_filter_bn_states: False


DETR:
  backbone: ResNet # CSPDarkNet
  neck: YOLOCSPPAN
  transformer: DINOTransformer
  detr_head: DINOHead
  post_process: DETRBBoxPostProcess



# depth_mult: 1.0
# width_mult: 1.0

# CSPDarkNet:
#   arch: "X"
#   return_idx: [2, 3, 4]
#   depthwise: False


ResNet:
  # index 0 stands for res2
  depth: 50
  norm_type: bn
  freeze_at: 0
  return_idx: [1, 2, 3]
  lr_mult_list: [0.1, 0.1, 0.1, 0.1]
  # lr_mult_list: [0.0421875, 0.05625, 0.075, 0.1]
  # lr_mult_list: [0.01, 0.03, 0.07, 0.1]
  num_stages: 4
  freeze_stem_only: true
  variant: d


YOLOCSPPAN:
  depthwise: False
  act: silu # relu

  use_trans: True
  nhead: 8
  num_layers: 2
  dim_feedforward: 1024
  dropout: 0.0 # 0.
  activation: 'gelu'  # relu
  # proj_dim: [512, 512, 512]
  proj_dim: [256, 256, 256]

  proj_conv: True
  proj_conv_bn: False
  use_repconv: False
  expand_ratio: 0.5

# YOLOCSPPAN:
#   depthwise: False
#   # act: 'relu'

# FPN:
#   out_channel: 256

DINOTransformer:
  num_queries: 300 # 900
  position_embed_type: sine
  num_levels: 3
  nhead: 8
  num_encoder_layers: 0
  num_decoder_layers: 6
  dim_feedforward: 1024 # 1024
  dropout: 0.0
  activation: relu
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learnt_init_query: False # True

  mlp_activation: relu
  keep_mlp_bias_weight_decay: True # False

  num_bbox_head_layers: 3
  num_query_pos_head_layers: 2

  use_sin_query_pos_embed: True
  sin_query_pos_ratio: 2

  learn_sin_query_pos_embed: False
  set_query_pos_embed_none: False
  add_lvl_pos_embed_flatten: False

  dn_epoch: 10000 # 33

  path_type: 'base' # sqr

  # path_type: 'sqr' # sqr
  # sqr_epoch: 1

  topk_sorted: True


DINOHead:
  eval_idx: -1

  loss:
    name: DINOLoss
    loss_coeff: {class: 1, bbox: 5, giou: 2} # {class: 2, bbox: 5, giou: 2}
    aux_loss: True
    use_vfl: True
    iou_type: 'giou' # siou_l
    only_use_encoder_matched_index: False

    fix_matched_once: False # True
    matcher_idx_list: ~
    # matcher_idx_list: [0, 3]
    # matcher_idx_list: [0, 4]
    # matcher_idx_list: [0, 5]

    # sqr_path_numbers: [1, 2, 3, 5, 8, 13]
    # sqr_epoch: 1

    matcher:
      name: HungarianMatcher
      matcher_coeff: {class: 2, bbox: 5, giou: 2}
      use_pos_only: True
      iou_type: 'giou' # siou_l


DETRBBoxPostProcess:
  num_top_queries: 300
